
<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .fundo {
            background-image:
                linear-gradient(
                    rgba(45, 0, 0, 0.15),
                    rgba(45, 0, 0, 0.15)
                ),
                url("./images/fundo.jpg");

            background-size: cover;
            background-repeat: repeat;
            background-position: center;

            height: 100vh;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        .fundo > h1 {
            padding-top: 30px;
            font-size: 30px;
            color: #fff0df;
            text-shadow: 2px 2px 5px #4b1015;
            letter-spacing: 2px;
        }

        .calculadora {
            position: absolute;
            background-color: rgba(75, 10, 15, 0.95);

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            border-radius: 18px;
            padding: 20px;

            border: 2px solid #d4b9a1;

            box-shadow: 0 8px 25px rgba(40, 0, 0, 0.5);
        }

        .calculadora h1 {
            color: #f0d9c2;
            margin-bottom: 10px;
            font-size: 27px;
        }

        .botao {
            width: 50px;
            height: 50px;

            font-size: 22px;
            cursor: pointer;
            margin: 3px;

            background-color: #4b1015;
            border: 1px solid #a8796b;
            border-radius: 8px;

            color: #fff0df;
            transition: 0.2s;
        }

        .botao:hover {
            background-color: #8b3035;
            transform: scale(1.05);
        }

        #resultado {
            background-color: #ead9c6;

            width: 232px;
            min-height: 40px;

            margin: 5px;
            font-size: 25px;

            color: #4b1015;
            text-align: right;

            padding: 5px;
            border-radius: 5px;

            overflow: hidden;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <div class="fundo">

        <h1>Ellen</h1>

        <div class="calculadora">

            <h1>Calculadora</h1>

            <p id="resultado"></p>

            <table>

                <tr>
                    <td><button class="botao" onclick="clean()">C</button></td>
                    <td><button class="botao" onclick="back()">&lt;</button></td>
                    <td><button class="botao" onclick="insert('/')">/</button></td>
                    <td><button class="botao" onclick="insert('*')">X</button></td>
                </tr>

                <tr>
                    <td><button class="botao" onclick="insert('7')">7</button></td>
                    <td><button class="botao" onclick="insert('8')">8</button></td>
                    <td><button class="botao" onclick="insert('9')">9</button></td>
                    <td><button class="botao" onclick="insert('-')">-</button></td>
                </tr>

                <tr>
                    <td><button class="botao" onclick="insert('4')">4</button></td>
                    <td><button class="botao" onclick="insert('5')">5</button></td>
                    <td><button class="botao" onclick="insert('6')">6</button></td>
                    <td><button class="botao" onclick="insert('+')">+</button></td>
                </tr>

                <tr>
                    <td><button class="botao" onclick="insert('1')">1</button></td>
                    <td><button class="botao" onclick="insert('2')">2</button></td>
                    <td><button class="botao" onclick="insert('3')">3</button></td>
                    <td rowspan="2">
                        <button class="botao" style="height: 106px;" onclick="calcular()">=</button>
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <button class="botao" style="width: 106px;" onclick="insert('0')">0</button>
                    </td>
                    <td><button class="botao" onclick="insert('.')">.</button></td>
                </tr>

            </table>
        </div>
    </div>

    <script>

        function insert(num) {
            var numero = document.getElementById('resultado').innerHTML;
            document.getElementById('resultado').innerHTML = numero + num;
        }

        function clean() {
            document.getElementById('resultado').innerHTML = "";
        }

        function back() {
            var resultado = document.getElementById('resultado').innerHTML;
            document.getElementById('resultado').innerHTML =
                resultado.substring(0, resultado.length - 1);
        }

        function calcular() {
            var resultado = document.getElementById('resultado').innerHTML;

            if (resultado) {
                document.getElementById('resultado').innerHTML = eval(resultado);
            } else {
                document.getElementById('resultado').innerHTML = "Nada...";
            }
        }

    </script>

</body>
</html>
